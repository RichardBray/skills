<!doctype html>
<meta charset="utf-8">
<title>short overlay</title>
<style>
  :root { --orange:#FF4C00; --bg:#141414; --ink:#F9F9F9; --dim:#8a8a8a; --panel:#1b1b1b; --line:#2d2d2d; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
  body { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; color:var(--ink); }
  .mono { font-family:Menlo,Monaco,monospace; }
  #stage { position:relative; width:1080px; height:1920px; overflow:hidden; }
  .abs { position:absolute; will-change:transform,opacity; }
  .card { border-radius:30px; background:rgba(20,20,20,.86); border:2px solid rgba(255,255,255,.14); box-shadow:0 20px 50px rgba(0,0,0,.35); backdrop-filter:blur(14px); padding:26px 34px; }
  .card .tag { font-family:Menlo,monospace; font-size:30px; color:var(--orange); letter-spacing:.06em; margin-bottom:6px; }
  .card .tx { font-size:58px; font-weight:800; letter-spacing:-.03em; line-height:1.05; }
  .chip { display:inline-flex; align-items:center; gap:12px; padding:12px 26px; border-radius:999px; background:#232323; border:2px solid #333; font-size:32px; font-weight:600; }
  .dot { width:15px; height:15px; border-radius:50%; background:var(--orange); }
  .term { border-radius:30px; background:#111; border:2px solid #2a2a2a; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.4); }
  .term .hd { height:80px; display:flex; align-items:center; padding:0 34px; font-size:38px; font-weight:700; border-bottom:2px solid #2a2a2a; gap:14px; }
  .term .log { font-family:Menlo,monospace; font-size:40px; line-height:1.4; padding:34px; color:#e8e8e8; white-space:pre-wrap; }
  .o{color:var(--orange)}.g{color:#5fd08a}.d{color:#8a8a8a}
  #caps { left:0; width:1080px; height:300px; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 70px; }
  #caps span { display:inline-block; font-size:98px; font-weight:800; letter-spacing:-.02em; line-height:1.08; color:#fff; margin:0 .14em; text-shadow:0 6px 0 rgba(0,0,0,.6), 0 0 40px rgba(0,0,0,.75); -webkit-text-stroke:2px rgba(0,0,0,.4); }
  #caps span.on { color:var(--orange); }
</style>
<div id="stage"><div id="scenes"></div><div id="caps" class="abs"></div></div>

<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const oc = x => 1 - Math.pow(1 - x, 3);
const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const typed = (str, t, a, b) => str.slice(0, Math.floor(str.length * ramp(t, a, b)));
function S(el, o = {}) { const op = o.o ?? 1; el.style.opacity = op; el.style.visibility = op <= .001 ? 'hidden' : 'visible'; el.style.transform = `translate(${o.x || 0}px,${o.y || 0}px) scale(${o.s ?? 1})`; }
const norm = w => w.toLowerCase().replace(/[^a-z0-9']/g, '');
const D = window.DATA;
const W = D.words.map(w => ({ ...w, n: norm(w.w) })).filter(w => w.n);
function anchor(phrase, which = 'start', from = 0) {
  const toks = phrase.split(/\s+/).map(norm).filter(Boolean);
  for (let i = Math.max(from, 0); i < W.length; i++) { let ok = true; for (let k = 0; k < toks.length; k++) if (!W[i + k] || W[i + k].n !== toks[k]) { ok = false; break; } if (ok) return which === 'end' ? W[i + toks.length - 1].end : W[i].start; }
  throw new Error('anchor not found in voiceover: "' + phrase + '"');
}
function resolve(obj, floor) {
  if (Array.isArray(obj)) return obj.forEach(x => resolve(x, floor));
  if (obj && typeof obj === 'object') for (const k of Object.keys(obj)) {
    if ((k === 'at' || k === 'to') && typeof obj[k] === 'string') { const from = Math.max(0, W.findIndex(w => w.start >= floor - 1e-6)); obj[k + 'T'] = anchor(obj[k], k === 'to' ? 'end' : 'start', from); } else resolve(obj[k], floor);
  }
}
const scenes = D.scenes;
scenes.forEach((s, i) => { s.startT = i === 0 ? 0 : anchor(s.from, 'start', W.findIndex(w => w.start >= scenes[i - 1].startT + 0.05)); });
scenes.forEach((s, i) => { s.endT = i + 1 < scenes.length ? scenes[i + 1].startT : D.duration; s.dur = s.endT - s.startT; resolve(s, s.startT); });

// layout -> where the face sits and where captions go
const LAYOUT = {
  float:  { face: 'full',  capY: 1250 },
  panel:  { face: 'bottom', capY: 1010 },
  strip:  { face: 'strip', capY: 1330 },
  cutaway:{ face: 'bubble', capY: 1130, hi: '#141414' },
};
const root = document.getElementById('scenes'); const events = [];
const ev = (t, type, gain = 1) => events.push({ t, type, gain });
const mk = () => { const el = document.createElement('div'); el.className = 'abs'; el.style.cssText = 'left:0;top:0;width:1080px;height:1920px'; root.appendChild(el); return el; };
const B = {
  // you full-frame; cards float around you
  float(sc) {
    const el = mk(); const cs = sc.cards;
    el.innerHTML = cs.map((c, i) => `<div class="abs card" id="fc${sc.startT}_${i}" style="left:${c.x}px;top:${c.y}px;${c.w ? 'width:' + c.w + 'px' : ''}"><div class="tag">${c.tag}</div><div class="tx">${c.text}</div></div>`).join('');
    cs.forEach(c => ev(c.atT, 'pop', .7));
    return { el, update(t) { cs.forEach((c, i) => { const lt = t - c.atT; const p = back(clamp(lt / .5)); const bob = Math.sin((t + i) * 1.6) * 8; S(document.getElementById(`fc${sc.startT}_${i}`), { o: clamp(lt * 6), s: .6 + .4 * p, y: (1 - oc(clamp(lt / .5))) * 50 + bob }); }); } };
  },
  // face in the bottom half; graphic fills the top half
  panel(sc) {
    const el = mk();
    el.innerHTML = `<div class="abs" id="pp${sc.startT}" style="left:50px;top:70px;width:980px;height:820px"><div class="abs" style="left:0;top:0"><span class="chip"><span class="dot"></span>${sc.chip || ''}</span></div>
      <div class="abs term" style="left:0;top:80px;width:980px;height:660px"><div class="hd"><span class="o">●</span> ${sc.title}</div><div class="log" id="pl${sc.startT}"></div></div></div>`;
    const ty = sc.items.find(i => i.type === 'type'); const nt = sc.items.filter(i => i.type === 'line');
    for (let k = 0; k < 12; k++) ev(ty.atT + (ty.toT - ty.atT) * k / 12, 'key', .5); nt.forEach(n => ev(n.atT, 'chime', .6));
    return { el, update(t) { const lt = t - sc.startT; const p = oc(clamp(lt / .45)); S(document.getElementById('pp' + sc.startT), { o: p, y: (1 - p) * -60 });
      let h = `<span class="o">$</span> ${typed(ty.text, t, ty.atT, ty.toT)}`; nt.forEach(n => { if (t >= n.atT) h += `\n\n<span style="opacity:${oc(clamp((t - n.atT) / .3))}">${n.html}</span>`; });
      document.getElementById('pl' + sc.startT).innerHTML = h; } };
  },
  // wide shot across the middle; cards above and below
  strip(sc) {
    const el = mk(); const its = sc.cards;
    el.innerHTML = its.map((c, i) => `<div class="abs card" id="sc${sc.startT}_${i}" style="left:60px;top:${c.y}px;width:960px"><div class="tag">${c.tag}</div><div class="tx">${c.text}</div></div>`).join('');
    its.forEach(c => ev(c.atT, 'pop', .7));
    return { el, update(t) { its.forEach((c, i) => { const p = oc(clamp((t - c.atT) / .45)); S(document.getElementById(`sc${sc.startT}_${i}`), { o: p, y: (1 - p) * (c.y < 700 ? -60 : 60) }); }); } };
  },
  // full-screen graphic; your face becomes a small bubble
  cutaway(sc) {
    const el = mk();
    el.innerHTML = `<div class="abs" id="cn${sc.startT}" style="left:0;width:1080px;top:330px;text-align:center"><div class="mono" style="font-size:300px;font-weight:700;letter-spacing:-.06em;color:#141414;line-height:1">${sc.value}</div>
        <div style="font-size:84px;font-weight:800;letter-spacing:-.03em;color:#141414;margin-top:6px">${sc.label}</div></div>
      <div class="abs mono" id="cs${sc.startT}" style="left:0;width:1080px;top:760px;text-align:center;font-size:44px;color:#141414;opacity:.8">${sc.sub}</div>`;
    ev(sc.startT + .05, 'impact', .8); ev(sc.atT, 'chime', .8);
    return { el, update(t) {
      const p = oc(clamp((t - sc.atT) / .5)); S(document.getElementById('cn' + sc.startT), { o: p, y: (1 - p) * 60, s: .9 + .1 * p }); S(document.getElementById('cs' + sc.startT), { o: oc(clamp((t - sc.atT - .3) / .4)) }); } };
  },
};
const built = scenes.map(sc => ({ sc, ...B[sc.type](sc) }));

const groups = []; { let g = []; W.forEach((w, i) => { const pr = W[i - 1]; if (g.length && (g.length >= 3 || w.start - pr.end > .35 || w.line !== pr.line || g.join(' ').length > 16)) { groups.push(g); g = []; } g.push(w); }); if (g.length) groups.push(g); }
const capsEl = document.getElementById('caps');
function captions(t, on) {
  const sc = scenes.find(s => t >= s.startT && t < s.endT) || scenes[scenes.length - 1];
  capsEl.style.top = (LAYOUT[sc.type].capY - 150) + 'px';
  const g = on ? groups.find(g => t >= g[0].start - .04 && t < g[g.length - 1].end + .12) : null;
  if (!g) { capsEl.style.opacity = 0; return; }
  const pop = oc(ramp(t, g[0].start - .04, g[0].start + .1)); capsEl.style.opacity = 1; capsEl.style.transform = `scale(${.94 + .06 * pop})`;
  capsEl.innerHTML = g.map(w => { const on2 = t >= w.start && t < w.end + .02; return `<span style="${on2 && LAYOUT[sc.type].hi ? 'color:' + LAYOUT[sc.type].hi + ';text-shadow:none;-webkit-text-stroke:0' : ''}" class="${on2 ? 'on' : ''}">${w.w}</span>`; }).join('');
}
window.render = t => {
  built.forEach(b => { const on = t >= b.sc.startT - .02 && t < b.sc.endT + .02; S(b.el, { o: on ? 1 : 0 }); if (on) b.update(t); });
  captions(t, D.captions !== false);
};
window.events = () => events.slice().sort((a, b) => a.t - b.t);
window.sceneTimes = () => scenes.map(s => ({ type: s.type, face: LAYOUT[s.type].face, bg: s.bg || null, start: +s.startT.toFixed(3), end: +s.endT.toFixed(3) }));
window.ready = Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))).then(() => document.fonts.ready);
</script>
