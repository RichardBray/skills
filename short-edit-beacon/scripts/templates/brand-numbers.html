 pop(claude,t,0.2);
 line.style.transform=`scaleY(${eo(prog(t,1.3,1.8))})`;dot.style.opacity=t>=1.8?1:0;

 pop(lab,t,3.1);
 const n1=Math.round(100*eo(prog(t,2.95,5.6)));big.textContent=t<2.95?'':(t>=5.6?'100M+':n1+'M');big.style.opacity=t>=2.95?1:0;
 pop(unit,t,2.95);
 const n2=Math.round(400*eo(prog(t,5.95,7.9)));big2.textContent=t<5.95?'':(t>=7.9?'400+':n2);big2.style.opacity=t>=5.95?1:0;

};
