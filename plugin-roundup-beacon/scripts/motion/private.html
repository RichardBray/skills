<style>
#floor{position:absolute;left:0;top:760px;width:1080px;height:760px;background:#f9f9f9}
#scene{position:absolute;left:0;top:0;width:1080px;height:1920px;perspective:1600px;perspective-origin:540px 1100px}
#badge{position:absolute;left:470px;top:790px;width:140px;height:140px;border-radius:40px;background:#111;display:flex;align-items:center;justify-content:center;box-shadow:0 22px 40px rgba(0,0,0,.25)}
#badge svg{width:72px;height:88px;overflow:visible}
#ring{position:absolute;left:540px;top:860px;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid #fa5d19;box-sizing:border-box;opacity:0}
#grid{position:absolute;left:120px;top:990px;width:840px;height:440px;transform-style:preserve-3d}
.t{position:absolute;width:404px;height:124px;box-sizing:border-box;border-radius:26px;background:#fff;border:3px solid #ececec;box-shadow:0 18px 32px rgba(17,17,17,.12);display:flex;align-items:center;gap:20px;padding:0 26px;font-family:"Helvetica Neue",Helvetica,sans-serif;font-size:30px;font-weight:700;letter-spacing:-.5px;color:#1f2937;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ico{position:relative;width:52px;height:52px;flex:none}
.ico span{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center}
.lk{background:#f1f1f1}
.ok{background:#fa5d19;opacity:0}
.ico svg{width:28px;height:28px}
</style>
<div id=floor></div>
<div id=scene>
  <div id=ring></div>
  <div id=badge><svg viewBox="0 0 72 88"><g id=sh><path d="M18 40 V26 a18 18 0 0 1 36 0 V40" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/></g><rect id=body x="4" y="38" width="64" height="48" rx="12" fill="#fff"/><circle cx="36" cy="60" r="7" fill="#111"/></svg></div>
  <div id=grid></div>
</div>
<script>
const names = ['People profiles', 'Work emails', 'Job postings', 'Company data', 'Funding rounds', 'Ad libraries'];
const lock = '<svg viewBox="0 0 28 28"><path d="M8 13V9a6 6 0 0 1 12 0v4" fill="none" stroke="#9ca3af" stroke-width="3.2" stroke-linecap="round"/><rect x="5" y="12" width="18" height="13" rx="4" fill="#9ca3af"/></svg>';
const tick = '<svg viewBox="0 0 28 28"><path d="M7 14.5l4.5 4.5L21 9.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const grid = document.getElementById('grid');
names.forEach((n, i) => {
  const d = document.createElement('div');
  d.className = 't'; d.id = 't' + i;
  d.style.left = (i % 2 ? 436 : 0) + 'px'; d.style.top = (Math.floor(i / 2) * 150) + 'px';
  d.innerHTML = `<div class=ico><span class=lk>${lock}</span><span class=ok>${tick}</span></div>${n}`;
  grid.appendChild(d);
});
const tl = gsap.timeline();
gsap.set('#grid', { rotationX: 10 });
tl.fromTo('#badge', { z: -1800, rotationY: 70, opacity: 0 }, { z: 0, rotationY: 0, opacity: 1, duration: 0.38, ease: 'back.out(1.8)' }, 0);
tl.fromTo('#ring', { scale: 1, opacity: 1 }, { scale: 14, opacity: 0, duration: 0.5, ease: 'power2.out' }, 0.3);
tl.to('#scene', { keyframes: [{ x: -12, y: 7, duration: 0.04 }, { x: 9, y: -5, duration: 0.04 }, { x: -5, y: 3, duration: 0.04 }, { x: 0, y: 0, duration: 0.05 }] }, 0.3);
names.forEach((_, i) => {
  tl.fromTo('#t' + i, { rotationX: -88, y: -40, opacity: 0, transformOrigin: '50% 0%' }, { rotationX: 0, y: 0, opacity: 1, duration: 0.38, ease: 'back.out(1.7)' }, 0.42 + i * 0.08);
});
tl.to('#grid', { rotationX: 4, rotationY: -4, duration: 2.6, ease: 'sine.inOut' }, 0.9);
tl.to('#sh', { y: -16, rotation: -18, transformOrigin: '54px 40px', duration: 0.28, ease: 'back.out(3)' }, {{UNLOCK}});
tl.to('#badge', { backgroundColor: '#fa5d19', scale: 1.1, duration: 0.18, ease: 'power2.out' }, {{UNLOCK}});
tl.to('#badge', { scale: 1, duration: 0.25, ease: 'power2.out' }, {{UNLOCK}} + 0.18);
names.forEach((_, i) => {
  const s = {{UNLOCK}} + 0.1 + i * 0.06;
  tl.to(`#t${i} .lk`, { opacity: 0, scale: 0.4, duration: 0.15 }, s);
  tl.fromTo(`#t${i} .ok`, { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(3)' }, s + 0.05);
  tl.to('#t' + i, { borderColor: '#ffc6ad', duration: 0.2 }, s);
});
tl.to(['#badge', '#grid'], { y: 80, opacity: 0, duration: 0.35, ease: 'power2.in' }, {{EXIT}});
</script>
